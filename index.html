
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT System Portal</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Kanit', sans-serif;
    background: #080e1b;
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 1100px;
    padding: 30px 20px;
}

/* HEADER */
.header {
    text-align: center;
    margin-bottom: 55px;
    border-bottom: 1px solid #1e293b;
    padding-bottom: 30px;
}

.logo {
    width: 70px;
    height: 70px;
    background: #2563eb;
    border-radius: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
}

.logo svg {
    width: 35px;
    height: 35px;
    stroke: white;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.header h1 {
    font-size: 28px;
    font-weight: 600;
}

.header p {
    color: #94a3b8;
    margin-top: 8px;
    font-size: 16px;
}

/* CARDS */
.cards {
    display: flex;
    flex-direction: row;
    gap: 15px;
    width: 100%;
}

.card {
    flex: 1 1 0;
    min-width: 0;
    text-align: center;
    padding: 25px 12px;
    background: #111c30;
    border: 1px solid #263b5a;
    border-radius: 22px;
    text-decoration: none;
    color: white;
    transition: 0.3s ease;
}

.card:hover {
    transform: translateY(-6px);
    background: #17243a;
    box-shadow: 0 10px 30px rgba(56,189,248,0.10);
}

/* ICON */
.icon {
    width: 70px;
    height: 70px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
}

.icon svg {
    width: 35px;
    height: 35px;
    stroke: white;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.blue {
    background: #2563eb;
}

.purple {
    background: #7c3aed;
}

.green {
    background: #059669;
}

/* TEXT */
.card h2 {
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 12px;
}

.card p {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.6;
}

.btn {
    display: inline-block;
    margin-top: 18px;
    font-size: 13px;
    color: #38bdf8;
}

/* FOOTER */
.footer {
    margin-top: 25px;
    text-align: center;
    font-size: 13px;
    color: #64748b;
}

/* MOBILE - STILL 3 COLUMNS */
@media (max-width: 600px) {

    body {
        align-items: center;
    }

    .container {
        padding: 20px 8px;
    }

    .header {
        margin-bottom: 25px;
        padding-bottom: 20px;
    }

    .logo {
        width: 55px;
        height: 55px;
        border-radius: 18px;
    }

    .logo svg {
        width: 28px;
        height: 28px;
    }

    .header h1 {
        font-size: 22px;
    }

    .header p {
        font-size: 12px;
    }

    .cards {
        gap: 8px;
        flex-direction: row;
    }

    .card {
        padding: 15px 5px;
        border-radius: 16px;
    }

    .icon {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        margin-bottom: 12px;
    }

    .icon svg {
        width: 26px;
        height: 26px;
    }

    .card h2 {
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 8px;
    }

    .card p {
        font-size: 10px;
        line-height: 1.5;
    }

    .btn {
        font-size: 10px;
        margin-top: 12px;
    }

    .footer {
        font-size: 10px;
        margin-top: 20px;
    }
}

/* EXTRA SMALL MOBILE */
@media (max-width: 380px) {
    .cards {
        gap: 5px;
    }

    .card {
        padding: 12px 3px;
    }

    .card h2 {
        font-size: 12px;
    }

    .card p {
        font-size: 9px;
    }

    .btn {
        font-size: 9px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">

        <div class="logo">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="14" rx="2"/>
                <path d="M8 22h8M12 18v4"/>
            </svg>
        </div>

        <h1>IT SYSTEM </h1>
        <p>ตรวจสอบตารางงาน</p>

    </header>

    <main class="cards">

        <!-- 1. แจ้งซ่อม - รูปประแจ -->
        <a class="card"
           href="https://it.e-tech.ac.th/checkstudent/ta/"
           target="_blank"
           rel="noopener noreferrer">

            <div class="icon blue">
                <svg viewBox="0 0 24 24">
                    <path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3.5 17.5a2.1 2.1 0 0 0 3 3l4.8-4.8a5 5 0 0 0 6.4-6.4L14 13l-3-3z"/>
                </svg>
            </div>

            <h2>แจ้งซ่อม</h2>
            <p>ระบบบันทึกการซ่อมคอมพิวเตอร์</p>
            <div class="btn">เข้าสู่ระบบ ↗</div>

        </a>

        <!-- 2. รายงานเวลา - รูปนาฬิกา -->
        <a class="card"
           href="https://it.e-tech.ac.th/checkstudent/TACOM/index.html"
           target="_blank"
           rel="noopener noreferrer">

            <div class="icon purple">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M12 7v5l3 2"/>
                </svg>
            </div>

            <h2>รายงานเวลา</h2>
            <p>ระบบบริการ TACOM</p>
            <div class="btn">เข้าสู่ระบบ ↗</div>

        </a>

        <!-- 3. ตรวจสอบคอม -->
        <a class="card"
           href="https://it.e-tech.ac.th/checkstudent/computer-check/index.php"
           target="_blank"
           rel="noopener noreferrer">

            <div class="icon green">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="14" rx="2"/>
                    <path d="M8 21h8M12 17v4"/>
                    <path d="m9 10 2 2 4-4"/>
                </svg>
            </div>

            <h2>ตรวจสอบคอม</h2>
            <p>ตรวจสอบอุปกรณ์</p>
            <div class="btn">เข้าสู่ระบบ ↗</div>

        </a>

    </main>

    

</div>

</body>
</html>
