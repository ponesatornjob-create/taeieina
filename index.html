<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT System Portal</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
}

body {
    font-family: 'Kanit', sans-serif;
    background: radial-gradient(circle at top center, #132240 0%, #080e1b 60%);
    color: #f1f5f9;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
}

/* HEADER */
.header {
    text-align: center;
    margin-bottom: 45px;
    border-bottom: 1px solid #1e293b;
    padding-bottom: 28px;
}

.logo {
    width: 70px;
    height: 70px;
    background: #2563eb;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 15px;
    box-shadow: 0 8px 24px rgba(37, 99, 235, 0.35);
}

.logo svg {
    width: 35px;
    height: 35px;
    stroke: white;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.header h1 {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: 0.5px;
}

.header p {
    color: #94a3b8;
    margin-top: 6px;
    font-size: 16px;
}

/* CARDS */
.cards {
    display: flex;
    flex-direction: row;
    justify-content: center;
    gap: 20px;
    width: 100%;
}

.card {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 30px 20px;
    background: rgba(17, 28, 48, 0.85);
    border: 1px solid #263b5a;
    border-radius: 22px;
    text-decoration: none;
    color: white;
    transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    -webkit-tap-highlight-color: transparent;
}

.card:hover {
    transform: translateY(-6px);
    background: #17243a;
    border-color: #38bdf8;
    box-shadow: 0 12px 30px rgba(56, 189, 248, 0.14);
}

.card:active {
    transform: scale(0.98);
}

/* ICON */
.icon {
    width: 68px;
    height: 68px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    flex-shrink: 0;
}

.icon svg {
    width: 34px;
    height: 34px;
    stroke: white;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.blue {
    background: #2563eb;
}

.purple {
    background: #7c3aed;
}

.green {
    background: #059669;
}

/* TEXT */
.card-text {
    width: 100%;
}

.card h2 {
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 8px;
}

.card p {
    font-size: 14px;
    color: #94a3b8;
    line-height: 1.5;
    margin-bottom: 20px;
}

.btn {
    margin-top: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.12);
    font-size: 13px;
    font-weight: 500;
    color: #38bdf8;
    transition: background 0.25s ease;
    flex-shrink: 0;
}

.card:hover .btn {
    background: rgba(56, 189, 248, 0.22);
}

/* FOOTER */
.footer {
    margin-top: 32px;
    text-align: center;
    font-size: 12px;
    color: #475569;
}

/* MOBILE - ชิดบน เต็มตา ไม่โล่ง ไม่ต้องเลื่อน */
@media (max-width: 768px) {
    body {
        align-items: flex-start;
        padding: 32px 18px 20px;
    }

    .container {
        max-width: 420px;
        height: 100%;
    }

    .header {
        margin-bottom: 28px;
        padding-bottom: 22px;
    }

    .logo {
        width: 62px;
        height: 62px;
        border-radius: 20px;
        margin-bottom: 12px;
    }

    .logo svg {
        width: 30px;
        height: 30px;
    }

    .header h1 {
        font-size: 24px;
    }

    .header p {
        font-size: 14px;
        margin-top: 4px;
    }

    .cards {
        flex-direction: column;
        gap: 16px;
    }

    .card {
        flex: none;
        width: 100%;
        flex-direction: row;
        align-items: center;
        text-align: left;
        padding: 20px 18px;
        gap: 16px;
        border-radius: 20px;
    }

    .card:hover {
        transform: none;
    }

    .icon {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        margin: 0;
    }

    .icon svg {
        width: 28px;
        height: 28px;
    }

    .card-text {
        flex: 1;
        min-width: 0;
    }

    .card h2 {
        font-size: 18px;
        margin-bottom: 3px;
    }

    .card p {
        font-size: 13px;
        margin-bottom: 0;
        line-height: 1.4;
    }

    .btn {
        margin-top: 0;
        width: 38px;
        height: 38px;
        padding: 0;
        font-size: 16px;
        border-radius: 50%;
    }

    .btn span {
        display: none;
    }

    .footer {
        margin-top: auto;
        padding-top: 16px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="14" rx="2"/>
                <path d="M8 22h8M12 18v4"/>
            </svg>
        </div>

        <h1>IT SYSTEM</h1>
        <p>ตรวจสอบตารางงาน</p>
    </header>

    <main class="cards">

        <!-- 1. แจ้งซ่อม -->
        <a class="card"
           href="https://it.e-tech.ac.th/checkstudent/ta/"
           target="_blank"
           rel="noopener noreferrer">
            <div class="icon blue">
                <svg viewBox="0 0 24 24">
                    <path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3.5 17.5a2.1 2.1 0 0 0 3 3l4.8-4.8a5 5 0 0 0 6.4-6.4L14 13l-3-3z"/>
                </svg>
            </div>
            <div class="card-text">
                <h2>แจ้งซ่อม</h2>
                <p>ระบบบันทึกการซ่อมคอมพิวเตอร์</p>
            </div>
            <div class="btn"><span>เข้าสู่ระบบ&nbsp;</span>↗</div>
        </a>

        <!-- 2. รายงานเวลา -->
        <a class="card"
           href="https://it.e-tech.ac.th/checkstudent/TACOM/index.html"
           target="_blank"
           rel="noopener noreferrer">
            <div class="icon purple">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M12 7v5l3 2"/>
                </svg>
            </div>
            <div class="card-text">
                <h2>รายงานเวลา</h2>
                <p>ระบบบริการ TACOM</p>
            </div>
            <div class="btn"><span>เข้าสู่ระบบ&nbsp;</span>↗</div>
        </a>

        <!-- 3. ตรวจสอบคอม -->
        <a class="card"
           href="https://it.e-tech.ac.th/checkstudent/computer-check/index.php"
           target="_blank"
           rel="noopener noreferrer">
            <div class="icon green">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="14" rx="2"/>
                    <path d="M8 21h8M12 17v4"/>
                    <path d="m9 10 2 2 4-4"/>
                </svg>
            </div>
            <div class="card-text">
                <h2>ตรวจสอบคอม</h2>
                <p>ตรวจสอบอุปกรณ์</p>
            </div>
            <div class="btn"><span>เข้าสู่ระบบ&nbsp;</span>↗</div>
        </a>

    </main>

    <footer class="footer">IT System Portal</footer>

</div>

</body>
</html>
