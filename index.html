<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT System TA</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap');

*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Kanit', sans-serif;
    background: radial-gradient(circle at top center, #132240 0%, #080e1b 65%);
    background-attachment: fixed;
    color: #f1f5f9;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: clamp(20px, 4vh, 50px) clamp(16px, 4vw, 48px);
    overflow-x: hidden;
}

.container {
    width: min(92vw, 1320px);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
}

/* HEADER */
.header {
    text-align: center;
    margin-bottom: clamp(28px, 4.5vh, 56px);
    border-bottom: 1px solid #1e293b;
    padding-bottom: clamp(20px, 3vh, 36px);
}

.logo {
    width: clamp(60px, 5vw, 92px);
    height: clamp(60px, 5vw, 92px);
    background: #2563eb;
    border-radius: clamp(18px, 1.8vw, 28px);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto clamp(12px, 1.5vh, 20px);
    box-shadow: 0 8px 28px rgba(37, 99, 235, 0.35);
}

.logo svg {
    width: 50%;
    height: 50%;
    stroke: white;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.header h1 {
    font-size: clamp(24px, 2.4vw, 42px);
    font-weight: 600;
    letter-spacing: 0.5px;
}

.header p {
    color: #94a3b8;
    margin-top: 6px;
    font-size: clamp(14px, 1.25vw, 22px);
}

/* CARDS */
.cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(14px, 2.2vw, 32px);
    width: 100%;
}

.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: clamp(24px, 3.2vw, 48px) clamp(16px, 2vw, 32px);
    background: rgba(17, 28, 48, 0.85);
    border: 1px solid #263b5a;
    border-radius: clamp(18px, 1.8vw, 28px);
    text-decoration: none;
    color: white;
    transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    -webkit-tap-highlight-color: transparent;
}

.card:hover {
    transform: translateY(-6px);
    background: #17243a;
    border-color: #38bdf8;
    box-shadow: 0 12px 32px rgba(56, 189, 248, 0.15);
}

.card:active {
    transform: scale(0.98);
}

/* ICON */
.icon {
    width: clamp(56px, 5vw, 88px);
    height: clamp(56px, 5vw, 88px);
    border-radius: clamp(16px, 1.5vw, 24px);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto clamp(14px, 1.8vw, 24px);
    flex-shrink: 0;
}

.icon svg {
    width: 50%;
    height: 50%;
    stroke: white;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.blue {
    background: #2563eb;
}

.purple {
    background: #7c3aed;
}

.green {
    background: #059669;
}

/* TEXT */
.card-text {
    width: 100%;
    margin-bottom: clamp(16px, 2vw, 28px);
}

.card h2 {
    font-size: clamp(18px, 1.6vw, 28px);
    font-weight: 500;
    margin-bottom: clamp(6px, 0.7vw, 10px);
}

.card p {
    font-size: clamp(13px, 1.05vw, 18px);
    color: #94a3b8;
    line-height: 1.5;
}

.btn {
    margin-top: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: clamp(8px, 0.7vw, 12px) clamp(16px, 1.5vw, 26px);
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.12);
    font-size: clamp(12px, 0.95vw, 16px);
    font-weight: 500;
    color: #38bdf8;
    transition: background 0.25s ease;
    flex-shrink: 0;
    white-space: nowrap;
}

.card:hover .btn {
    background: rgba(56, 189, 248, 0.22);
}

/* FOOTER */
.footer {
    margin-top: clamp(24px, 4vh, 48px);
    text-align: center;
    font-size: clamp(12px, 0.9vw, 15px);
    color: #475569;
}

/* MOBILE - ชิดบน พอดีจอ ไม่ต้องเลื่อน */
@media (max-width: 640px) {
    body {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        align-items: flex-start;
        padding: 28px 18px 20px;
    }

    .container {
        width: 100%;
        max-width: 440px;
        height: 100%;
    }

    .header {
        margin-bottom: 24px;
        padding-bottom: 20px;
    }

    .logo {
        width: 60px;
        height: 60px;
        border-radius: 18px;
        margin-bottom: 12px;
    }

    .header h1 {
        font-size: 24px;
    }

    .header p {
        font-size: 14px;
        margin-top: 4px;
    }

    .cards {
        grid-template-columns: 1fr;
        gap: 14px;
    }

    .card {
        flex-direction: row;
        align-items: center;
        text-align: left;
        padding: 18px 16px;
        gap: 15px;
        border-radius: 20px;
    }

    .card:hover {
        transform: none;
    }

    .icon {
        width: 54px;
        height: 54px;
        border-radius: 16px;
        margin: 0;
    }

    .card-text {
        flex: 1;
        min-width: 0;
        margin-bottom: 0;
    }

    .card h2 {
        font-size: 17px;
        margin-bottom: 2px;
    }

    .card p {
        font-size: 13px;
        line-height: 1.4;
    }

    .btn {
        margin-top: 0;
        width: 38px;
        height: 38px;
        padding: 0;
        font-size: 16px;
        border-radius: 50%;
    }

    .btn span {
        display: none;
    }

    .footer {
        margin-top: auto;
        padding-top: 16px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <header class="header">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="14" rx="2"/>
                <path d="M8 22h8M12 18v4"/>
            </svg>
        </div>

        <h1>IT SYSTEM TA</h1>
        <p>ตรวจสอบตารางงาน</p>
    </header>

    <main class="cards">

        <!-- 1. แจ้งซ่อม -->
        <a class="card"
           href="https://it.e-tech.ac.th/checkstudent/ta/"
           target="_blank"
           rel="noopener noreferrer">
            <div class="icon blue">
                <svg viewBox="0 0 24 24">
                    <path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3.5 17.5a2.1 2.1 0 0 0 3 3l4.8-4.8a5 5 0 0 0 6.4-6.4L14 13l-3-3z"/>
                </svg>
            </div>
            <div class="card-text">
                <h2>แจ้งซ่อม</h2>
                <p>ระบบบันทึกการซ่อมคอมพิวเตอร์</p>
            </div>
            <div class="btn"><span>เข้าสู่ระบบ&nbsp;</span>↗</div>
        </a>

        <!-- 2. รายงานเวลา -->
        <a class="card"
           href="https://it.e-tech.ac.th/checkstudent/TACOM/index.html"
           target="_blank"
           rel="noopener noreferrer">
            <div class="icon purple">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"/>
                    <path d="M12 7v5l3 2"/>
                </svg>
            </div>
            <div class="card-text">
                <h2>รายงานเวลา</h2>
                <p>ระบบบริการ TACOM</p>
            </div>
            <div class="btn"><span>เข้าสู่ระบบ&nbsp;</span>↗</div>
        </a>

        <!-- 3. ตรวจสอบคอม -->
        <a class="card"
           href="https://it.e-tech.ac.th/checkstudent/computer-check/index.php"
           target="_blank"
           rel="noopener noreferrer">
            <div class="icon green">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="18" height="14" rx="2"/>
                    <path d="M8 21h8M12 17v4"/>
                    <path d="m9 10 2 2 4-4"/>
                </svg>
            </div>
            <div class="card-text">
                <h2>ตรวจสอบลิ้นชัก</h2>
                <p>ตรวจสอบอุปกรณ์</p>
            </div>
            <div class="btn"><span>เข้าสู่ระบบ&nbsp;</span>↗</div>
        </a>

    </main>

    <footer class="footer">IT System TA</footer>

</div>

</body>
</html>
